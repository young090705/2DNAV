/**:
  ros__parameters:
    # Absolute path, or filename relative to this package's installed maps/ directory.
    pcd_file: "RMUC2026_duo.pcd"
    pcd_frame_id: "pcd_map"
    # Translation of the PCD frame in map coordinates (meters, live).
    pcd_offset_x: 14.6
    pcd_offset_y: 7.45
    map_yaml: "RMUC2026.yaml"
    map_topic: "/map"
    # Optional live alignment parameters: map_origin_x, map_origin_y, map_origin_yaw.
    # If omitted, initial values come from the map YAML (meters, meters, radians).
    frame_id: "map"
    topic_name: "/map_server/map_cloud"
    # Hz; 0 publishes once and retains the map for late transient-local subscribers.
    publish_rate: 1.0
